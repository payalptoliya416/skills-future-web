<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Future</title>
    <!-- --fonts -->
    <link rel="stylesheet" href="assets/css/fonts.css"/>
    <link href="https://db.onlinewebfonts.com/c/4679956de12dd2d8fc06ed0333e1d21b?family=Proxima+Soft" rel="stylesheet"/>
    <!-- --font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- --bootstrap -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css"/>
    <!-- --style -->
    <link rel="stylesheet" href="assets/css/style.css"/>

</head>

<body>

    <div class="photobooth-page main">
        <div class="photobooth-widget generate-widget">

            <!-- ================= HEADER ================= -->
            <div class="photobooth-header">
                <div class="cover-letter-art"></div>
            </div>

            <!-- ================= PROGRESS ================= -->
            <div class="photobooth-progress">
                <div class="progress-line" role="progressbar" aria-label="Onboarding progress" data-step="5" data-total="6" aria-valuenow="83.33" aria-valuemin="0" aria-valuemax="100">
                    <span></span>
                </div>
            </div>

            <!-- ================= CONTENT ================= -->
            <div class="photobooth-content generate-content">

                <div class="generate-spinner" role="status" aria-label="Generating your headshot">
                    <span class="visually-hidden">Loading&hellip;</span>
                </div>

                <p class="generate-status">Creating your<br>professional photo&hellip;</p>

                <div class="generation-allowance">
                    <span class="generation-allowance__icon">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </span>
                    <span class="generation-allowance__label">Generating attempt</span>
                    <strong class="generation-allowance__value">1 of 3</strong>
                </div>

            </div>

            <!-- ================= BUTTON ================= -->
            <div class="photobooth-btn-container generate-actions">

                <button type="button" class="photobooth-secondary-btn" id="previewGeneratedBtn" disabled>
                    Preview generated image
                </button>

            </div>

        </div>
    </div>

    <!-- --bootstrap-- -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <!-- --main js-- -->
    <script src="assets/js/main.js"></script>
</body>

</html>
