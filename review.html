<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Future</title>
    <!-- --fonts -->
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link href="https://db.onlinewebfonts.com/c/4679956de12dd2d8fc06ed0333e1d21b?family=Proxima+Soft"
        rel="stylesheet" />
    <!-- --font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- --bootstrap -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <!-- --style -->
    <link rel="stylesheet" href="assets/css/style.css" />

</head>

<body>

    <div class="photobooth-page main">
        <div class="photobooth-widget review-widget">

            <!-- ================= HEADER ================= -->
            <div class="photobooth-header">
                <div class="cover-letter-art">
                    <a href="take-photo.html" class="btn back-btn">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Back</span>
                    </a>
                </div>
            </div>

            <!-- ================= PROGRESS ================= -->
            <div class="photobooth-progress">
                <div class="progress-line" role="progressbar" aria-label="Onboarding progress" data-step="4"
                    data-total="6" aria-valuenow="66.67" aria-valuemin="0" aria-valuemax="100">
                    <span></span>
                </div>
            </div>

            <!-- ================= CONTENT ================= -->
            <div class="photobooth-content review-content">

                <h1 class="photobooth-title">Review your photo</h1>

                <div class="review-photo-frame">

                    <img id="reviewPhoto" alt="Your captured headshot" hidden />

                    <div class="review-photo-placeholder" id="reviewPhotoPlaceholder">
                        <i class="fa-solid fa-image"></i>
                        <p>No photo found. Please take a photo first.</p>
                    </div>

                </div>

                <div class="generation-allowance-main">
                    <span class="generation-allowance__icon">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </span>
                    <span class="generation-allowance__label">Generation allowance</span>
                    <strong class="generation-allowance__value">3 attempts remaining</strong>
                </div>

            </div>

            <!-- ================= BUTTON ================= -->
            <div class="photobooth-btn-container review-actions">

                <a href="generate.html" class="photobooth-start-btn" id="generateHeadshotBtn">
                    Generate headshot
                </a>

                <a href="take-photo.html" class="photobooth-secondary-btn">
                    Retake photo
                </a>

            </div>

        </div>
    </div>

    <!-- --bootstrap-- -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <!-- --main js-- -->
    <script src="assets/js/main.js"></script>
</body>

</html>
