<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills Future</title>
  <!-- --fonts -->
  <link rel="stylesheet" href="assets/css/fonts.css" />
  <link href="https://db.onlinewebfonts.com/c/4679956de12dd2d8fc06ed0333e1d21b?family=Proxima+Soft" rel="stylesheet" />
  <!-- --bootstrap -->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
  <!-- --style -->
  <link rel="stylesheet" href="assets/css/style.css" />

</head>

<body>

  <div class="main ">

    <!-- ================= TOP LOGO ================= -->
    <div class="festival-logo">
      <img src="assets/images/logo.png" alt="Skills Future Festival" />
    </div>


    <!-- ================= CONTENT ================= -->
    <div class="create-account-content-area">
      <form class="account-form">

        <h1>Create your account</h1>

        <!-- Full Name -->
        <div class="form-group-data">
          <label class="form-label">Full Name*</label>
          <input type="text" class="form-control" value="Jane Doe" placeholder="Enter your full name" />
        </div>

        <!-- Email -->
        <div class="form-group-data">
          <label class="form-label">Email*</label>
          <input type="email" class="form-control" placeholder="Enter your email" />
        </div>

        <!-- Birth Year -->
        <div class="form-group-data">
          <label class="form-label">Birth year*</label>

          <select class="form-control">
            <option value="" selected disabled>Select a year</option>
            <option>1990</option>
            <option>1991</option>
            <option>1992</option>
            <option>1993</option>
            <option>1994</option>
            <option>1995</option>
            <option>1996</option>
            <option>1997</option>
            <option>1998</option>
            <option>1999</option>
            <option>2000</option>
            <option>2001</option>
            <option>2002</option>
            <option>2003</option>
            <option>2004</option>
            <option>2005</option>
          </select>
        </div>

        <!-- Employment Status -->
        <div class="form-group-data">
          <label class="form-label">Employment status*</label>

          <div class="option-box">
            <div class="option-grid">

              <label class="option">
                <input type="radio" name="employment" checked />
                <span class="radio"></span>
                <span>Employed</span>
              </label>

              <label class="option">
                <input type="radio" name="employment" />
                <span class="radio"></span>
                <span>Unemployed</span>
              </label>

              <label class="option">
                <input type="radio" name="employment" />
                <span class="radio"></span>
                <span>Self-Employed/<br>Freelance</span>
              </label>

              <label class="option">
                <input type="radio" name="employment" />
                <span class="radio"></span>
                <span>Retrenched</span>
              </label>

            </div>
          </div>
        </div>

        <!-- Highest Education -->
        <div class="form-group-data education-group">
          <label class="form-label">Highest education*</label>

          <div class="option-box">
            <div class="option-grid">

              <label class="option">
                <input type="radio" name="education" checked />
                <span class="radio"></span>
                <span>A/O-Levels or below</span>
              </label>

              <label class="option">
                <input type="radio" name="education" />
                <span class="radio"></span>
                <span>ITE</span>
              </label>

              <label class="option">
                <input type="radio" name="education" />
                <span class="radio"></span>
                <span>Diploma</span>
              </label>

              <label class="option">
                <input type="radio" name="education" />
                <span class="radio"></span>
                <span>Bachelor's Degree<br>and above</span>
              </label>

            </div>
          </div>
        </div>
        <!-- Bottom Create Account Button -->
        <div class="button-area">
          <a href="Questionnaire.html" class="btn festival-btn create-btn">
            Create account
          </a>
        </div>
      </form>
    </div>


    <!-- ================= BOTTOM LOGOS ================= -->
    <div class="bottom-logos">

      <div class="organised-logo">

        <span>Organised by:</span>

        <div class="logo-row">
          <img src="assets/images/lifelong-learning.png" alt="Lifelong Learning" />
          <img src="assets/images/swsda.png" alt="SWSDA" />
        </div>

      </div>


      <div class="support-logo">

        <span>In support of:</span>

        <div class="logo-row">

          <img src="assets/images/skillsfuture-festival-small.png" alt="SkillsFuture Festival" />
          <img src="assets/images/skillsfuture-support.png" alt="SkillsFuture" />
        </div>

      </div>

    </div>

  </div>
  <!-- --bootstrap-- -->
  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <!-- --main js-- -->
  <script src="assets/js/main.js"></script>
</body>

</html>
