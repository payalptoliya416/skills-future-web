<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Future</title>

    <!-- --fonts -->
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link href="https://db.onlinewebfonts.com/c/4679956de12dd2d8fc06ed0333e1d21b?family=Proxima+Soft"
        rel="stylesheet" />
    <!-- --font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- --bootstrap -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <!-- --style -->
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
    <div class="main">
        <div class="festival-logo">
            <a href="personalised_dashborad.html">
                <img src="assets/images/logo.png" alt="Skills Future Festival" />
            </a>
        </div>

        <section class="camera-permission-page">
            <div class="qr-card">
                <a class="qr-close" id="scannerCloseBtn" aria-label="Close">
                    <i class="fa-solid fa-xmark"></i>
                </a>

                <h1 class="qr-title">Scan a QR code</h1>
                <p class="qr-subtitle">Place the QR code inside the frame.</p>

                <div class="qr-frame qr-frame--off">
                    <span class="qr-corner qr-corner--tl"></span>
                    <span class="qr-corner qr-corner--tr"></span>
                    <span class="qr-corner qr-corner--bl"></span>
                    <span class="qr-corner qr-corner--br"></span>

                    <p class="qr-frame-off-title">Camera access is off</p>
                    <p class="qr-frame-off-desc">
                        To scan QR codes, allow camera access in your browser or phone settings, then return here.
                    </p>
                </div>

                <p class="qr-status" id="cameraOffStatus" role="status" aria-live="polite"></p>

                <div class="job-detail-btn-container">
                    <a href="#" class="qr-primary-btn" id="tryAgainBtn" data-bs-toggle="modal"
                        data-bs-target="#cameraPermissionModal">
                        Try again
                    </a>
                </div>
            </div>

        </section>

    </div>
    <!-- --modal-- -->
    <div class="modal fade" id="cameraPermissionModal" tabindex="-1" aria-labelledby="cameraPermissionModalLabel"
        aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-body text-center">
                    <div class="qr-native-dialog">
                        <p>&ldquo;SkillsFuture Festival&rdquo; would like to access the camera</p>
                        <div class="qr-native-actions">
                            <a class="qr-native-btn qr-native-btn--deny" id="denyCameraBtn">Don&rsquo;t Allow</a>
                            <a class="qr-native-btn qr-native-btn--allow" id="allowCameraBtn">Allow</a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- --bootstrap-- -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <!-- --main js-- -->
    <script src="assets/js/main.js"></script>
</body>

</html>
