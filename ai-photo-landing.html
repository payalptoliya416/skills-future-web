<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Future</title>
    <!-- --fonts -->
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link href="https://db.onlinewebfonts.com/c/4679956de12dd2d8fc06ed0333e1d21b?family=Proxima+Soft"
        rel="stylesheet" />
    <!-- --font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- --bootstrap -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <!-- --style -->
    <link rel="stylesheet" href="assets/css/style.css" />

</head>

<body>

    <div class="photobooth-page main">
        <div class="photobooth-widget">

            <!-- ================= HEADER ================= -->
            <div class="photobooth-header">
                <div class="cover-letter-art">
                    <a href="job-listing.html" class="btn back-btn">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Back</span>
                    </a>
                </div>
            </div>

            <!-- ================= PROGRESS ================= -->
            <div class="photobooth-progress">
                <div class="progress-line" role="progressbar" aria-label="Onboarding progress" data-step="1"
                    data-total="6" aria-valuenow="16.67" aria-valuemin="0" aria-valuemax="100">
                    <span></span>
                </div>
            </div>

            <!-- ================= CONTENT ================= -->
            <div class="photobooth-content">

                <h1 class="photobooth-title">AI Professional<br>Photobooth</h1>

                <p class="photobooth-subtitle">
                    Choose a style, take a photo, and create a professional headshot in 3 quick steps.
                </p>

                <div class="photobooth-image-wrap">
                    <img src="assets/images/ai-photo-transform.png"
                        alt="Before and after AI professional headshot transformation" />
                </div>

            </div>

            <!-- ================= BUTTON ================= -->
            <div class="photobooth-btn-container">
                <a href="select-gender.html" class="photobooth-start-btn">
                    Start
                </a>
            </div>

        </div>
    </div>

    <!-- --bootstrap-- -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <!-- --main js-- -->
    <script src="assets/js/site-map.js"></script>
</body>

</html>
