<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Future</title>
    <!-- --fonts -->
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link href="https://db.onlinewebfonts.com/c/4679956de12dd2d8fc06ed0333e1d21b?family=Proxima+Soft"
        rel="stylesheet" />
    <!-- --font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- --bootstrap -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <!-- --style -->
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>

    <div class="main ">

        <!-- ================= TOP LOGO ================= -->
        <div class="festival-logo">
               <a href="personalised_dashborad.html">
                <img src="assets/images/logo.png" alt="Skills Future Festival" />
            </a>
        </div>


        <!-- ================= CONTENT ================= -->
        <div class="account-content-area container">

            <h1>Welcome to<br>SkillsFuture Festival</h1>

            <p class="intro-text">
                Discover learning opportunities, explore new skills,<br class="desktop-break">
                and make the most of your festival experience.
            </p>


            <!-- ================= EMAIL ================= -->
            <div class="email-group">
                <label for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="Enter your email" />

            </div>


            <!-- ================= BUTTONS ================= -->
            <div class="button-area">

                <a href="varification.html" class="btn festival-btn sign-in-btn">
                    Sign in
                </a>

                <a href="create-account.html" class="btn festival-btn create-btn">
                    Create an account
                </a>

            </div>

        </div>


        <!-- ================= BOTTOM LOGOS ================= -->
        <div class="bottom-logos">
            <div class="organised-logo">
                <span>Organised by:</span>
                <div class="logo-row">
                    <img src="assets/images/lifelong-learning.png" alt="Lifelong Learning" />
                    <img src="assets/images/swsda.png" alt="SWSDA" />
                </div>
            </div>

            <div class="support-logo">
                <span>In support of:</span>
                <div class="logo-row">
                    <img src="assets/images/skillsfuture-festival-small.png" alt="SkillsFuture Festival" />
                    <img src="assets/images/skillsfuture-support.png" alt="SkillsFuture" />
                </div>
            </div>
        </div>

    </div>
    <!-- --bootstrap-- -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <!-- --main js-- -->
    <script src="assets/js/main.js"></script>
</body>

</html>
