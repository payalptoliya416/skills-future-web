<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skills Future</title>
  <!-- --fonts -->
  <link rel="stylesheet" href="assets/css/fonts.css" />
  <link href="https://db.onlinewebfonts.com/c/4679956de12dd2d8fc06ed0333e1d21b?family=Proxima+Soft" rel="stylesheet" />
  <!-- --font awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <!-- --bootstrap -->
  <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
  <!-- --style -->
  <link rel="stylesheet" href="assets/css/style.css" />

</head>

<body>
  <div class="main">

    <!-- ================= TOP LOGO ================= -->
    <div class="cover-letter-art">
      <a href="create-account.html" class="btn back-btn">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Back</span>
      </a>
    </div>

    <!-- ================= CONTENT ================= -->
    <div class="career-interests-questionnaire container">

      <div class="progress-line" role="progressbar" aria-label="Onboarding progress" aria-valuenow="11.11"
        aria-valuemin="0" aria-valuemax="100">
        <span></span>
      </div>



      <!-- Header -->
      <div class="career-questionnaire-start-label">
        LET’S START...
      </div>

      <h1 class="career-questionnaire-title">
        What would you<br>
        like help with today?
      </h1>


      <!-- Career Interest Options -->
      <div class="career-interests-options">

        <!-- 1. Explore New Career -->
        <label class="career-interest-option">
          <input type="checkbox" name="career_interests[]" value="Explore new career" />
          <span class="career-interest-option__check"></span>
          <span class="career-interest-option__text">Explore new career</span>
        </label>


        <!-- 2. Build Future-Ready Skills -->
        <label class="career-interest-option">
          <input type="checkbox" name="career_interests[]" value="Build future-ready skills" />
          <span class="career-interest-option__check"></span>
          <span class="career-interest-option__text">Build future-ready skills</span>
        </label>


        <!-- 3. Find Courses and Training -->
        <label class="career-interest-option">
          <input type="checkbox" name="career_interests[]" value="Find courses and training" />
          <span class="career-interest-option__check"></span>
          <span class="career-interest-option__text">Find courses and training</span>
        </label>


        <!-- 4. Discover Job Opportunities -->
        <label class="career-interest-option">
          <input type="checkbox" name="career_interests[]" value="Discover job opportunities" />
          <span class="career-interest-option__check"></span>
          <span class="career-interest-option__text">Discover job opportunities </span>
        </label>


        <!-- 5. Improve Resume -->
        <label class="career-interest-option career-interest-option--long">
          <input type="checkbox" name="career_interests[]" value="Improve my resume and professional profile" />
          <span class="career-interest-option__check"></span>
          <span class="career-interest-option__text">Improve my resume and<br>professional profile</span>
        </label>


        <!-- 6. Grow Current Role -->
        <label class="career-interest-option">
          <input type="checkbox" name="career_interests[]" value="Grow in my current role" />
          <span class="career-interest-option__check"></span>
          <span class="career-interest-option__text">Grow in my current role</span>
        </label>


        <!-- 7. Not Sure -->
        <label class="career-interest-option">
          <input type="checkbox" name="career_interests[]" value="I’m not sure where to begin" />
          <span class="career-interest-option__check"></span>
          <span class="career-interest-option__text"> I’m not sure where to begin</span>
        </label>
      </div>



      <!-- ================= BUTTONS ================= -->
      <div class="cover-lette">
        <a href="personalised_dashborad.html" class="start-building-btn">Keep Going </a>
      </div>


    </div>
  </div>
  <!-- --bootstrap-- -->
  <script src="assets/js/bootstrap.bundle.min.js"></script>
  <!-- --main js-- -->
  <script src="assets/js/site-map.js"></script>
</body>

</html>
