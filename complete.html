<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Future</title>

    <link rel="stylesheet" href="assets/css/fonts.css">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://db.onlinewebfonts.com/c/4679956de12dd2d8fc06ed0333e1d21b?family=Proxima+Soft" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="main">
        <section class="job-detail-page">

            <div class="job-detail-art">
                <a href="index.html" class="back-btn exit-btn">
                    <i class="fa-solid fa-xmark"></i>
                    <span>Exit</span>
                </a>
            </div>

            <div class="container job-detail-content">

                <div class="progress-line-data" role="progressbar" aria-label="Onboarding progress" data-step="7" data-total="7" aria-valuemin="0" aria-valuemax="100">
                    <span></span>
                </div>

                <div class="job-detail-container job-detail-container--centered">

                    <div class="success-check" aria-hidden="true">
                        <img src="assets/images/cover-ready.png" alt="Success check" />
                    </div>

                    <h1 class="job-detail-title job-detail-title--center">Your cover letter is ready</h1>

                    <p class="job-detail-description job-detail-description--center">Save a copy directly to your phone.</p>

                    <div class="pdf-card">
                        <span class="pdf-card-icon">
                            PDF
                        </span>
                        <span class="pdf-card-copy">
                            <span class="pdf-card-title" id="pdfCardTitle">Cover Letter &mdash; Marketing Executive</span>
                            <span class="pdf-card-status">Ready to download</span>
                        </span>
                    </div>

                </div>

            </div>

            <div class="job-detail-btn-container job-detail-btn-container--stacked">
                <a href="#" class="start-building-btn" id="downloadLetterBtn">
                    <img src="assets/images/download-icon.png" alt="Download icon" />
                    Download cover letter
                </a>
                <a href="generating.html" class="review-answers-btn review-answers-btn--stacked" id="createAnotherBtn">
                    <span>Create another cover letter</span>
                    <span class="review-answers-btn-sub" id="createAnotherSub">Uses 1 attempt</span>
                </a>
                <a href="index.html" class="tertiary-link-btn">
                    Return to homepage
                </a>
            </div>

        </section>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
