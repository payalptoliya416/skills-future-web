<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Future</title>

    <!-- --fonts -->
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link href="https://db.onlinewebfonts.com/c/4679956de12dd2d8fc06ed0333e1d21b?family=Proxima+Soft"
        rel="stylesheet" />
    <!-- --font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- --bootstrap -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <!-- --style -->
    <link rel="stylesheet" href="assets/css/style.css" />
</head>

<body>
    <div class="main">
        <section class="job-detail-page">

            <div class="container job-detail-content genrating-review">

                <div class="progress-line-data" role="progressbar" aria-label="Onboarding progress" data-step="6"
                    data-total="7" aria-valuemin="0" aria-valuemax="100">
                    <span></span>
                </div>

                <div class="job-detail-container">

                    <h1 class="job-detail-title">Review your cover letter</h1>

                    <p class="job-detail-description">Check the details carefully before approving your letter.</p>

                    <div class="letter-preview" id="letterPreview" tabindex="0" aria-label="Generated cover letter">
                        <!-- populated by review.js -->
                    </div>

                </div>

            </div>

            <div class="job-detail-btn-container job-detail-btn-container--stacked">
                <button type="button" class="start-building-btn" id="approveLetterBtn">
                    Approve cover letter
                </button>
                <a href="job-details.html" class="review-answers-btn" id="editDetailsBtn">
                    Edit my details
                </a>
            </div>

        </section>
    </div>

    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
