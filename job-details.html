<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Future</title>

    <link rel="stylesheet" href="assets/css/fonts.css">
    <link rel="stylesheet" href="assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://db.onlinewebfonts.com/c/4679956de12dd2d8fc06ed0333e1d21b?family=Proxima+Soft" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css" integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="main">
        <section class="job-detail-page">

            <div class="job-detail-art">
                <a href="job-detail-landing.html" class="back-btn">
                    <i class="fa-solid fa-arrow-left"></i>
                    <span>Back</span>
                </a>
            </div>


            <div class="container job-detail-content">

                <div class="progress-line-data" role="progressbar" aria-label="Onboarding progress" data-step="2" data-total="7" aria-valuemin="0"    aria-valuemax="100">
                    <span></span>
                </div>

                <div class="job-detail-container">

                    <p class="job-detail-label">Step 1 of 3</p>

                    <h1 class="job-detail-title">What role are you applying for?</h1>

                    <p class="job-detail-description">This helps tailor the letter to the opportunity.</p>

                    <form class="job-detail-form" novalidate>

                        <div class="form-group">
                            <label for="job-title">Job title</label>
                            <input type="text" id="job-title" name="job-title" value="Marketing Executive">
                        </div>

                        <div class="form-group">
                            <label for="industry">Industry</label>
                            <input type="text" id="industry" name="industry" value="Financial services">
                        </div>

                        <div class="form-group">
                            <label for="company-name">Company name <span class="optional">(optional)</span></label>
                            <input type="text" id="company-name" name="company-name" placeholder="e.g. ABC Company">
                        </div>

                        <div class="form-group">
                            <label for="job-requirements">Key job requirements <span class="optional">(optional)</span></label>
                            <textarea id="job-requirements" name="job-requirements" placeholder="Paste or summarise the most important requirements"></textarea>
                        </div>

                    </form>

                </div>

            </div>

            <div class="job-detail-btn-container">
                <a href="highlight-selection.html" class="start-building-btn">
                    Continue
                </a>
            </div>


        </section>

    </div>

    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>

</html>
