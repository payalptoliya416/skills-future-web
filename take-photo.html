<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills Future</title>
    <!-- --fonts -->
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link href="https://db.onlinewebfonts.com/c/4679956de12dd2d8fc06ed0333e1d21b?family=Proxima+Soft"
        rel="stylesheet" />
    <!-- --font awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- --bootstrap -->
    <link rel="stylesheet" href="assets/css/bootstrap.min.css" />
    <!-- --style -->
    <link rel="stylesheet" href="assets/css/style.css" />

</head>

<body>

    <div class="photobooth-page main">
        <div class="photobooth-widget take-photo-widget">

            <!-- ================= HEADER ================= -->
            <div class="photobooth-header">
                <div class="cover-letter-art">
                    <a href="select-gender.html" class="btn back-btn">
                        <i class="fa-solid fa-arrow-left"></i>
                        <span>Back</span>
                    </a>
                </div>
            </div>

            <!-- ================= PROGRESS ================= -->
            <div class="photobooth-progress">
                <div class="progress-line" role="progressbar" aria-label="Onboarding progress" data-step="3"
                    data-total="6" aria-valuenow="50" aria-valuemin="0" aria-valuemax="100">
                    <span></span>
                </div>
            </div>

            <!-- ================= CONTENT ================= -->
            <div class="photobooth-content take-photo-content">
                <h1 class="photobooth-title">Get ready for your photo</h1>
                <p class="photobooth-subtitle">
                    Look at the camera and keep your face centered.
                </p>
                <div class="camera-stage" id="cameraStage">
                    <video id="cameraVideo" class="camera-video" autoplay playsinline muted></video>
                    <img id="capturedPhoto" class="captured-photo" alt="Captured headshot preview" hidden />
                    <div class="camera-countdown" id="cameraCountdown" aria-live="assertive" hidden></div>
                    <div class="camera-flash" id="cameraFlash"></div>
                    <div class="camera-placeholder" id="cameraPlaceholder">
                        <i class="fa-solid fa-camera"></i>
                        <p id="cameraPlaceholderText">Requesting camera access&hellip;</p>
                        <button type="button" class="camera-retry-btn" id="cameraRetryBtn" hidden>Enable camera</button>
                    </div>
                </div>
                <div class="generation-allowance-main">
                    <span class="generation-allowance__icon">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                    </span>
                    <span class="generation-allowance__label">Generation allowance</span>
                    <strong class="generation-allowance__value" id="attemptsRemaining">3 attempts remaining</strong>
                </div>
                <canvas id="captureCanvas" hidden></canvas>
            </div>

            <!-- ================= BUTTON ================= -->
            <div class="photobooth-btn-container take-photo-actions">
                <button type="button" class="photobooth-start-btn" id="takePhotoBtn" disabled>
                    Take photo
                </button>
            </div>
        </div>
    </div>

    <!-- --bootstrap-- -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <!-- --main js-- -->
    <script src="assets/js/main.js"></script>
</body>

</html>
